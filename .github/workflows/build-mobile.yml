name: Mobile builds

# Compiling is not the same as working on a phone, and this workflow only claims
# the first: it proves the Android and iOS projects still build from a clean
# checkout, which is what has to be true before anybody can install one and try
# it. Nothing here is signed and nothing is published.
#
# Kept apart from `ci.yml` because these are the expensive jobs — a macOS runner
# bills at ten times the Linux rate — so they run for pull requests and for main,
# not for every push to every branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.1"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  android:
    name: Android — ${{ matrix.edition }} APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        # Every Android distribution, because they differ in ways a build can
        # get wrong silently: `libre` is F-Droid's and is called Privio Libre,
        # `direct` is the website APK called Privio with the same free-software
        # dependencies, and `play` is the only one allowed to contain Firebase.
        edition: [libre, direct, play]

    steps:
      - uses: actions/checkout@v4

      # The Gradle config sets source and target compatibility to 17, so the
      # runner's default JDK is not something to leave to chance.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # A flavour is not optional: `android/app/build.gradle.kts` declares the
      # `distribution` dimension with `libre` and `play`, and a build without
      # one is refused. The edition has to be passed alongside it, because the
      # Gradle flavour sets the Android resources and the dart-define sets what
      # the Dart code reads — they are two halves of the same choice.
      # The flavour and the edition are the same word on purpose: Gradle
      # refuses the build if they disagree, so a mismatch is a failed build
      # rather than a wrongly-labelled APK.
      - name: Build APK
        run: >-
          flutter build apk --release
          --flavor ${{ matrix.edition }}
          --dart-define=PRIVIO_EDITION=${{ matrix.edition }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privio-${{ matrix.edition }}-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS — unsigned build
    runs-on: macos-latest

    # Not on the push to `main`. A merge into main is checked as its merge
    # commit while it is still a pull request — the same tree, on the same
    # runner image, minutes earlier — and this is the job that bills at ten
    # times the rate, so running it again for the merge buys a second opinion
    # about a tree that has not changed. `workflow_dispatch` is still here for
    # when somebody wants one on demand, and `build.yml` runs it for a tag.
    if: github.event_name != 'push'

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # No `--flavor`: the Xcode project has one scheme, `Runner`. The Android
      # flavours have no counterpart here, and asking for one fails.
      #
      # The edition is `appstore` and has to be said. iOS used to be built with
      # `PRIVIO_EDITION=libre` — copied from the Android job — which produced a
      # binary that called itself free software, offered the licence-key screen
      # a store build must never show, and registered for UnifiedPush instead of
      # APNs. A release build now refuses an unknown edition rather than
      # falling back, but a *wrong* one is still a wrong one, so it is set here.
      #
      # Two commands rather than one `flutter build ios --no-codesign`, because
      # of what that one does with an entitlements file.
      #
      # The Runner target carries `Runner.entitlements` — it has to: without
      # `aps-environment` the app never gets a push token on a device. An
      # entitlement is a claim about a provisioning profile, so Xcode wants one
      # even when signing is off, and the first run of this job on a real macOS
      # runner failed with Flutter's "requires a selected Development Team with
      # a Provisioning Profile" after compiling for 66 seconds. There is no team
      # here and there should not be: this job checks that the project
      # *compiles*, and a compile check that needs an Apple account is not one.
      #
      # So the entitlements are cleared for this build only. `--config-only`
      # writes the dart-defines and runs CocoaPods; the archive-less xcodebuild
      # below does the compiling, and prints its own errors instead of Flutter's
      # summary of them.
      - name: Configure the Xcode project
        run: >-
          flutter build ios --config-only --release --no-codesign
          --dart-define=PRIVIO_EDITION=appstore

      - name: Build iOS (no signing, no entitlements)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: privio-ios-unsigned
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
