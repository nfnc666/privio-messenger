name: Code Quality & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'lines_valid": \K[0-9]+' coverage/lcov.info | head -1)
          COVERED=$(grep -oP 'lines_hit": \K[0-9]+' coverage/lcov.info | head -1)
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "Could not parse coverage"
            exit 0
          fi
          PERCENTAGE=$((COVERED * 100 / COVERAGE))
          echo "Coverage: $PERCENTAGE%"
          if [ $PERCENTAGE -lt 70 ]; then
            echo "Coverage is below 70% threshold"
            exit 1
          fi
