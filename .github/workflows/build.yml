name: Build APK & IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # No version pin: app/pubspec.yaml requires Flutter >=3.22.0.
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./app
        run: flutter pub get

      # The app ships as flavours, so a bare `flutter build apk` no longer has
      # enough to go on. Both are built here because both are shipped: `libre`
      # is what F-Droid and the direct APK come from, `play` is the store build.
      - name: Build Libre APK
        working-directory: ./app
        run: |
          flutter build apk --release --flavor libre \
            --dart-define=PRIVIO_EDITION=libre \
            --dart-define=PRIVIO_API_URL=https://api.getprivio.com

      - name: Build Play APK
        working-directory: ./app
        run: |
          flutter build apk --release --flavor play \
            --dart-define=PRIVIO_EDITION=play \
            --dart-define=PRIVIO_API_URL=https://api.getprivio.com

  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # No version pin: app/pubspec.yaml requires Flutter >=3.22.0.
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build iOS
        working-directory: ./app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=PRIVIO_EDITION=appstore \
            --dart-define=PRIVIO_API_URL=https://api.getprivio.com
