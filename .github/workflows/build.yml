name: Release artifacts

# Tag builds. The same two compilations `build-mobile.yml` runs on a pull
# request, kept for a version tag so a release has something to attach.
#
# Neither artifact is signed for distribution: the Android release build uses
# the debug key (see `android/app/build.gradle.kts`, which says so and why), and
# the iOS build is `--no-codesign`. Signing is a release step with secrets
# behind it, and it is not part of this workflow.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Never cancelled: a release build that was halfway through when the next tag
# landed is a release with no artifact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  build-android:
    name: Android — ${{ matrix.flavour }} APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        # Every Android distribution the Gradle config declares. They differ in
        # more than a name — `play` does not carry the licence-key screen and
        # wakes over FCM instead of UnifiedPush, and `direct` is the website APK
        # that shares Libre's free-software dependencies under its own name — so
        # building a subset would leave the rest unproven.
        flavour: [libre, direct, play]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: >-
          flutter build apk --release
          --flavor ${{ matrix.flavour }}
          --dart-define=PRIVIO_EDITION=${{ matrix.flavour }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privio-${{ matrix.flavour }}-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS — unsigned build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # `appstore`, explicitly. A release build refuses an unknown edition, but
      # a wrong one would still ship: `libre` here would put the licence-key
      # screen and UnifiedPush into an App Store binary.
      #
      # Two commands rather than one `flutter build ios --no-codesign`, because
      # of what that one does with an entitlements file.
      #
      # The Runner target carries `Runner.entitlements` — it has to: without
      # `aps-environment` the app never gets a push token on a device. An
      # entitlement is a claim about a provisioning profile, so Xcode wants one
      # even when signing is off, and the first run of this job on a real macOS
      # runner failed with Flutter's "requires a selected Development Team with
      # a Provisioning Profile" after compiling for 66 seconds. There is no team
      # here and there should not be: this job checks that the project
      # *compiles*, and a compile check that needs an Apple account is not one.
      #
      # So the entitlements are cleared for this build only. `--config-only`
      # writes the dart-defines and runs CocoaPods; the archive-less xcodebuild
      # below does the compiling, and prints its own errors instead of Flutter's
      # summary of them.
      - name: Configure the Xcode project
        run: >-
          flutter build ios --config-only --release --no-codesign
          --dart-define=PRIVIO_EDITION=appstore

      - name: Build iOS (no signing, no entitlements)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: privio-ios-unsigned
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/Runner.app
          if-no-files-found: error
