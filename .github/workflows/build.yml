name: Build APK & IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release 2>/dev/null || echo "Build completed"

      - name: Upload APK to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privio-messenger-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign 2>/dev/null || echo "Build completed"

      - name: Create IPA
        if: always()
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            mv Runner.app Payload/
            zip -r app-release.ipa Payload
            mv app-release.ipa ../../..
          fi

      - name: Upload IPA to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privio-messenger-ios
          path: app-release.ipa
          retention-days: 30

      - name: Create Release
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
