name: Flutter Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # No version pin: app/pubspec.yaml requires Flutter >=3.22.0, and a
          # pin below that fails at `pub get` before anything is tested.
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Analyze code
        working-directory: ./app
        run: flutter analyze

      - name: Run tests
        working-directory: ./app
        run: flutter test --coverage

      - name: Upload coverage reports (optional)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./app/coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
