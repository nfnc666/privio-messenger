name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server — types and tests
    runs-on: ubuntu-latest

    # The suite exercises real transactions and unique indexes — atomic license
    # redemption, idempotent sends — so it needs a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/privio_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm --workspace server run typecheck

      - name: Tests
        run: npm test

  app:
    name: App — analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    env:
      # The Flutter tooling reports usage to Google Analytics by default. On a
      # project that ships "no tracking" in its own README, the build machine
      # should not be an exception.
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
