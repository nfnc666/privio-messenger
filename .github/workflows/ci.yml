name: CI

# A pull request is checked as the merge commit it would create, which is the
# thing that matters and is a better check than the branch tip. Pushing to that
# same branch used to start a second, near-identical run of every job; `push` is
# main-only now, so a commit is checked once on its way in and once after.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseding a pull request should stop the run it superseded. On `main` it
# should not: every commit that lands there is checked on its own, and a merge
# that cancels the one before it leaves a commit nobody ever ran.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The version is pinned rather than tracking `stable`, so a run that passed
# yesterday means the same thing today: "reproducible" and "whatever the channel
# moved to overnight" are not compatible. The floor comes from the app's own
# pubspec (`flutter: ">=3.22.0"`, `sdk: ">=3.4.0"`); this is the release the
# checks were last verified against locally.
env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  server:
    name: Server — types and tests
    runs-on: ubuntu-latest

    # The suite exercises real transactions and unique indexes — atomic license
    # redemption, idempotent sends — so it needs a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/privio_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm --workspace server run typecheck

      - name: Tests
        run: npm test

  app:
    name: App — analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    env:
      # The Flutter tooling reports usage to Google Analytics by default. On a
      # project that ships "no tracking" in its own README, the build machine
      # should not be an exception.
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
