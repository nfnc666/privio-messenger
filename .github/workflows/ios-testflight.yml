name: iOS signed build

# A signed iOS build, made entirely on GitHub's macOS runner, for somebody with
# an iPhone and no Mac. Started by hand — never on a push, never on a tag —
# because it signs with a real Apple identity and can put a build in front of
# testers, and neither of those should happen because a branch moved.
#
# The upload to TestFlight is a separate decision from the build: `upload` is
# `no` by default, and a run that leaves it there produces an .ipa artifact and
# talks to Apple only for signing. Nothing here publishes to the App Store —
# TestFlight is not the store, and no review is submitted.
#
# Cost, said plainly: this repository is public, and public repositories get
# GitHub-hosted runners free, macOS included — so a run costs nothing today.
# That changes the moment the repository is made private: macOS bills at **ten
# times** the Linux rate, and a run of this workflow is roughly 20–35 minutes of
# wall clock, which would be 200 to 350 minutes of quota. Read
# `docs/ios-testflight.md` before starting one.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server the build talks to, https:// only (e.g. https://api.example.org)"
        required: true
        type: string
      upload:
        description: "Upload the build to TestFlight when it succeeds"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      bundle_id:
        description: "Bundle identifier registered to your Apple team"
        required: true
        default: "app.privio.privio"
        type: string
      build_number:
        description: "CFBundleVersion. Leave empty to use the run number, which only ever goes up"
        required: false
        type: string
      xcode_version:
        description: "Xcode to select (e.g. 16.2). Empty uses the runner image's default"
        required: false
        type: string

# Two signing runs at once would race for the same certificate and profile.
concurrency:
  group: ios-signed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  build:
    name: Signed .ipa${{ inputs.upload == 'yes' && ' → TestFlight' || '' }}
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # Everything that can be wrong without spending a macOS minute on it is
      # checked here, at the top, with a message that says what to fix. A run
      # that dies twenty minutes in because a secret was missing has cost real
      # money to tell you something knowable in one second.
      - name: Check the inputs and the secrets
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_URL: ${{ inputs.api_url }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          case "$API_URL" in
            https://*) ;;
            *) fail "api_url must start with https:// — iOS refuses plain HTTP, and the build would install and never connect." ;;
          esac

          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              fail "Secret $name is not set. See docs/ios-testflight.md — the four App Store Connect secrets are the minimum."
            fi
          done

          # The private key is a .p8 from App Store Connect. Checking the header
          # catches the commonest paste mistake — the file's name instead of its
          # contents — without printing any of it.
          case "$ASC_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) fail "APPSTORE_PRIVATE_KEY does not look like a .p8 key. Paste the whole file, including the BEGIN and END lines." ;;
          esac

          if [ -n "${DIST_CERT:-}" ]; then
            [ -n "${DIST_CERT_PASSWORD:-}" ] || fail "IOS_DIST_CERT_P12_BASE64 is set but IOS_DIST_CERT_PASSWORD is not."
            [ -n "${PROFILE:-}" ] || fail "IOS_DIST_CERT_P12_BASE64 is set but IOS_PROVISIONING_PROFILE_BASE64 is not. Manual signing needs both."
            echo "signing=manual" >> "$GITHUB_ENV"
            echo "Signing with the certificate and profile in the secrets."
          else
            echo "signing=automatic" >> "$GITHUB_ENV"
            echo "Signing automatically: Xcode will fetch or create the certificate and profile through the API key."
            echo "::notice::Automatic signing creates a new distribution certificate per runner, and Apple allows only a few. Run the 'iOS signing setup' workflow once to make one certificate and keep it in the secrets — after that this build reuses it instead."
          fi

      # Apple rejects an upload built with an SDK it considers too old, and the
      # runner image's *default* Xcode is not its newest: this image defaults to
      # 16.4 (iOS 18.5 SDK) while carrying 26.3 beside it, and the first upload
      # that reached Apple came back "All iOS and iPadOS apps must be built with
      # the iOS 26 SDK or later". So the newest installed Xcode is selected
      # rather than inherited — which also survives the next time Apple raises
      # the floor, without editing this file.
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION:-}" ]; then
            DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            [ -d "$DEVELOPER_DIR" ] || {
              echo "::error::Xcode ${XCODE_VERSION} is not on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1;
            }
          else
            NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
            [ -n "$NEWEST" ] || { echo "::error::no versioned Xcode found on this runner"; exit 1; }
            DEVELOPER_DIR="$NEWEST/Contents/Developer"
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "Selected $DEVELOPER_DIR"

      - name: Say which Xcode this is
        run: |
          xcodebuild -version
          # The SDK version is what Apple validates the upload against.
          xcodebuild -showsdks | grep -i "iOS" || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The API key is written straight from the secret to a file that only the
      # runner user can read, and never passed on a command line, echoed, or
      # committed anywhere. `~/private_keys` is one of the three directories
      # altool looks in for it; xcodebuild is given the path explicitly.
      - name: Place the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Manual signing only. A dedicated keychain with a throwaway password,
      # deleted at the end of the job, so the certificate never touches the
      # login keychain and never outlives the run.
      - name: Import the signing certificate
        if: env.signing == 'manual'
        env:
          DIST_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/privio-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$DIST_CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops for a UI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install the provisioning profile
        if: env.signing == 'manual'
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          # The export step has to name the profile, and the name lives inside
          # the file rather than in a secret somebody has to keep in step.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $NAME"

      - name: Point the project at your bundle identifier
        if: inputs.bundle_id != 'app.privio.privio'
        working-directory: app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          # The test target's identifier is replaced first, so that the shorter
          # pattern below cannot turn `…privio.RunnerTests` into a duplicate of
          # the app's own identifier.
          /usr/bin/sed -i '' \
            -e "s|PRODUCT_BUNDLE_IDENTIFIER = app.privio.privio.RunnerTests;|PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}.RunnerTests;|g" \
            -e "s|PRODUCT_BUNDLE_IDENTIFIER = app.privio.privio;|PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};|g" \
            ios/Runner.xcodeproj/project.pbxproj
          echo "Runner configurations now on ${BUNDLE_ID}:"
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get
        working-directory: app

      # Not a build: this writes `Generated.xcconfig` — the dart-defines, the
      # version and the build number — and runs CocoaPods. The archive below is
      # what compiles, through the Runner target's own Flutter build phase, so
      # building here as well would compile everything twice.
      - name: Configure the Xcode project
        working-directory: app
        env:
          API_URL: ${{ inputs.api_url }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-}"
          [ -n "$BUILD_NUMBER" ] || BUILD_NUMBER="${{ github.run_number }}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # `--no-codesign` is not a weakening: this step compiles nothing and
          # signs nothing, it writes `Generated.xcconfig` and runs CocoaPods.
          # Without the flag, Flutter's tooling still runs its own signing check
          # first, looks for an *Apple Development* identity, finds only the
          # distribution certificate this workflow imported, and stops with "No
          # valid code signing certificates were found" — advice about opening
          # Xcode, on a runner where nobody can. The real signing happens in the
          # Archive step below, with the manual profile and that same
          # certificate. `build.yml` has always passed this flag on the same
          # command; this workflow was missing it.
          flutter build ios --config-only --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PRIVIO_EDITION=appstore \
            --dart-define=PRIVIO_API_URL="$API_URL" \
            --dart-define=PRIVIO_COMMIT=${{ github.sha }}
          [ -d ios/Pods ] || (cd ios && pod install)

      # Manual signing, applied to the one target it can apply to.
      #
      # `xcodeproj` is the gem CocoaPods is built on, so it is already present
      # wherever `pod install` runs. Editing the project on the runner keeps
      # the team id and the profile name out of the repository, which is where
      # they would otherwise have to live to be set per-target.
      #
      # Release only: that is what the archive builds, and Debug's "iPhone
      # Developer" default stays correct for anyone running on a cabled device.
      - name: Point the Runner target at the distribution identity
        if: env.signing == 'manual'
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            target = project.targets.find { |t| t.name == "Runner" } or abort "no Runner target"
            target.build_configurations.each do |config|
              next unless config.name == "Release"
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
              # Both forms: the project pins the SDK-conditional one, and a
              # plain value does not replace it.
              config.build_settings["CODE_SIGN_IDENTITY"] = "iPhone Distribution"
              config.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "iPhone Distribution"
              puts "Release signing: Manual, iPhone Distribution, profile #{ENV.fetch("PROFILE_NAME")}"
            end
            project.save
          '

      - name: Archive
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARGS=(
            -workspace ios/Runner.xcworkspace
            -scheme Runner
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          )
          if [ "$signing" = "manual" ]; then
            # Only the keychain flag goes on the command line. Everything else
            # about manual signing was applied to the Runner target in the step
            # above, because an xcodebuild command-line setting applies to every
            # target in the workspace — all 22 of them. Specifying a
            # provisioning profile that way made CocoaPods' `Pods-Runner` and
            # the plugins' resource bundles fail with "does not support
            # provisioning profiles", which is true: a resource bundle has
            # nothing to provision.
            ARGS+=(
              OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"
            )
          else
            # `-allowProvisioningUpdates` is what lets Xcode register the bundle
            # id, create the profile and issue a certificate through the API key
            # — the reason none of this needs a Mac.
            ARGS+=(
              CODE_SIGN_STYLE=Automatic
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            )
          fi
          xcodebuild "${ARGS[@]}" archive

      - name: Export the .ipa
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          # `app-store` is the TestFlight and App Store distribution method. It
          # is not a submission: what it produces is an .ipa that App Store
          # Connect will accept, and nothing is sent anywhere by this step.
          cat > "$PLIST" <<PLIST_END
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          PLIST_END
          if [ "$signing" = "manual" ]; then
            {
              printf '  <key>signingStyle</key><string>manual</string>\n'
              printf '  <key>provisioningProfiles</key>\n'
              printf '  <dict><key>%s</key><string>%s</string></dict>\n' "$BUNDLE_ID" "$PROFILE_NAME"
            } >> "$PLIST"
          else
            printf '  <key>signingStyle</key><string>automatic</string>\n' >> "$PLIST"
          fi
          printf '</dict>\n</plist>\n' >> "$PLIST"

          ARGS=(
            -exportArchive
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"
            -exportOptionsPlist "$PLIST"
            -exportPath "$RUNNER_TEMP/ipa"
          )
          if [ "$signing" = "automatic" ]; then
            ARGS+=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            )
          fi
          xcodebuild "${ARGS[@]}"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: privio-ios-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # Only when the run was started with `upload: yes`. An .ipa in the
      # artifacts is a build; a build in TestFlight is something testers can
      # install, which is a decision and not a side effect.
      - name: Upload to TestFlight
        if: inputs.upload == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)"
          echo "Uploading $(basename "$IPA") to App Store Connect."
          # Validation first: it catches a missing icon, a bad entitlement or a
          # build number Apple has already seen, before the upload rather than
          # in an email twenty minutes later.
          xcrun altool --validate-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded. App Store Connect still has to finish processing, and TestFlight will ask about export compliance before internal testers can install it."

      # Runs whatever happened above, including a cancelled run: a private key
      # and a signing identity must not survive the job that needed them.
      - name: Remove the key material
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
