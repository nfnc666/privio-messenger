analyzer:
  exclude:
    - build/**
    # Vendored, reviewed third-party code, checked by its own upstream rather
    # than by these lints. See third_party/libsignal_dart/PRIVIO_VENDORING.md.
    - third_party/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
