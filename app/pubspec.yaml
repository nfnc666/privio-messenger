name: privio
description: Privio — privacy-first secure messenger.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Talks to the Privio API. Nothing leaves the device unencrypted.
  http: ^1.2.2
  # Keychain on iOS, EncryptedSharedPreferences/Keystore on Android.
  flutter_secure_storage: ^9.2.2
  # Renders the invite deep link as a QR code, on-device.
  qr_flutter: ^4.1.0
  libsignal_protocol_dart: ^0.8.2
  cryptography: ^2.9.0
  file_picker: ^11.0.3
  web_socket_channel: ^3.0.3
  image: ^4.9.2
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  # The typeface ships with the app. A Flutter web build otherwise fetches its
  # fallback font from Google's font CDN on first paint, which tells a third
  # party when someone opens the messenger.
  fonts:
    - family: Privio
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
