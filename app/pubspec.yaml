name: privio
description: Privio — privacy-first secure messenger.
publish_to: none
version: 0.1.0+1

# Raised from 3.4.0/3.22.0 with `file_picker` 12, which needs these. It is not
# a loss: the older floor described a version range that could not produce an
# Android APK, so nothing was building against it anyway. CI pins 3.47.1, which
# is the version every result in the README was measured on.
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Talks to the Privio API. Nothing leaves the device unencrypted.
  http: ^1.2.2
  # Keychain on iOS, AES-GCM over the Keystore on Android. Holds the session
  # token, the archive key and the recovery key.
  #
  # At 10 rather than 9, and the reason is worth keeping: 9 pulled
  # `flutter_secure_storage_windows` 3.1.2, which pins `win32` ^5, while
  # `file_picker` 12 pulls `windows_file_picker`, which needs ^6. That was
  # papered over with a `win32` override and a comment saying the Windows
  # plugins are never compiled because there is no `windows/` directory.
  #
  # They are. Flutter's generated `dart_plugin_registrant.dart` imports every
  # platform's Dart plugin into one file and switches on `Platform.isX` at
  # runtime, so the Windows implementation is compiled into an iOS build too —
  # and against the overridden `win32` it did not compile at all. No release
  # build of this app worked, on any platform, until CI came back and said so.
  #
  # 10.3.1 allows `flutter_secure_storage_windows` 4.2.2, which is on `win32`
  # ^6, so the conflict is gone and there is no override. Not 11: that one
  # drops the migration path from 9, and 10 still performs it on first access.
  flutter_secure_storage: ^10.3.1
  # Renders the invite deep link as a QR code, on-device.
  qr_flutter: ^4.1.0
  libsignal_protocol_dart: ^0.8.2
  cryptography: ^2.9.0
  # 12, not 11. Eleven applies its own Kotlin Gradle Plugin, which stopped
  # producing its Android classes once Flutter moved to built-in Kotlin, and the
  # registrant Flutter generates then fails to compile: `cannot find symbol:
  # class FilePickerPlugin`. That is the whole reason no Android APK could be
  # built. Twelve fixes it; what blocked twelve was a Windows package, and the
  # override below is why that no longer decides anything here.
  file_picker: ^12.2.0
  web_socket_channel: ^3.0.3
  image: ^4.9.2
  # Office and OpenDocument files are ZIP containers, and their author name,
  # company and editing history live in named parts inside them. Already here
  # as a transitive dependency of `image`; named now because the scrubber
  # depends on it directly.
  archive: ^4.0.0
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.1
  # Jumping to a message a search found. A plain ListView can only be told an
  # offset, and the offset of a message hundreds of lines up is not knowable
  # until it has been laid out. Pure Dart, from the Flutter team's own widgets
  # repository — it adds nothing native and nothing to the F-Droid build.
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  # The typeface ships with the app. A Flutter web build otherwise fetches its
  # fallback font from Google's font CDN on first paint, which tells a third
  # party when someone opens the messenger.
  #
  # The same three files are declared twice, under two names, and the second one
  # is the one that actually stops the request. The CanvasKit engine keeps a
  # default font of its own so that laying out text with an unregistered family
  # cannot crash it, and it downloads that font from Google *unless the app's
  # font manifest declares a family literally called `Roboto`*
  # (`SkiaFontCollection.loadAssetFonts`). Declaring ours as `Privio` alone left
  # the bundled file sitting unused beside a request to fonts.gstatic.com on
  # every page load — the exact thing bundling it was meant to prevent. Naming
  # it costs nothing: the asset is bundled once and referenced twice.
  fonts:
    - family: Privio
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
